# Coolify deployment for the d-arken/logto fork (chore/coolify-deploy branch).
#
# Coolify: New resource -> Public/Private repository -> d-arken/logto, branch `chore/coolify-deploy`,
# build pack "Docker Compose", compose file `/docker-compose.coolify.yml`.
#
# Domains (set on the `logto` service in Coolify, comma separated, port = container port):
#   https://auth.<domain>:3001,https://auth-admin.<domain>:3002
#
# Environment variables to set in Coolify:
#   ENDPOINT        https://auth.<domain>         (OIDC issuer = ENDPOINT/oidc)
#   ADMIN_ENDPOINT  https://auth-admin.<domain>
# SERVICE_PASSWORD_POSTGRES is generated by Coolify automatically.
#
# CIMD ("Dynamic app", used by MCP clients such as Claude Code / VS Code) requires SSRF protection
# to stay ON: never set SSRF_PROTECTION_DISABLED, OIDC_PROVIDER_SSRF_PROTECTION_DISABLED or
# SSRF_ALLOWED_ADDRESSES here.
services:
  logto:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    # Seed on first boot (skipped when already seeded), apply schema alterations on every deploy
    # so pulling upstream into the fork upgrades the database, then start.
    entrypoint:
      - sh
      - -c
      - npm run cli db seed -- --swe && npm run cli db alteration deploy latest && npm start
    environment:
      TRUST_PROXY_HEADER: 1
      DB_URL: postgres://logto:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/logto
      ENDPOINT: ${ENDPOINT}
      ADMIN_ENDPOINT: ${ADMIN_ENDPOINT}
    expose:
      - "3001"
      - "3002"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3001/api/status"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: logto
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      POSTGRES_DB: logto
    volumes:
      - logto-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logto -d logto"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  logto-postgres:
